# spark-defaults.conf del client: recursos de cada trabajo.
# 3 executors, uno por worker, de 2 núcleos y 3 GB + 512 MB: caben en los 6 GB de cada worker.
spark.master                     yarn
spark.submit.deployMode          client
spark.driver.memory              2g
spark.executor.instances         3
spark.executor.cores             2
spark.executor.memory            3g
spark.executor.memoryOverhead    512m
# spark.driver.host (IP del client) lo añade client-install-spark.sh: la IP solo se conoce en el client.
