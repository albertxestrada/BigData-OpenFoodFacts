---
# cluster.sh ejecuta primero prepare, después el playbook de clase y luego el resto.
# Se conservan las tareas remotas aquí para mantener el .sh corto y fácil de seguir.
- name: Preparar el playbook de clase descargado
  hosts: localhost
  connection: local
  gather_facts: false
  tags: prepare
  vars:
    # Ansible ejecuta esta ruta en un shell; las comillas conservan sus espacios.
    ansible_python_interpreter: "{{ ansible_playbook_python | quote }}"
    ansible_remote_tmp: "{{ runtime_dir }}/tmp"
  tasks:
    - name: Limitar el inventario a los nodos Hadoop de este proyecto
      ansible.builtin.copy:
        dest: "{{ upstream_dir }}/inventory.aws_ec2.yml"
        mode: '0644'
        content: |
          plugin: amazon.aws.aws_ec2
          regions: [{{ aws_region }}]
          filters:
            tag:Group: [hadoop-master, hadoop-worker]
            instance-state-name: running
          keyed_groups:
            - prefix: tag
              key: tags

    - name: Usar el archivo de Apache para Hadoop 3.3.6
      ansible.builtin.replace:
        path: "{{ upstream_dir }}/create-instances.yml"
        regexp: 'https://dlcdn.apache.org/hadoop/common/'
        replace: 'https://archive.apache.org/dist/hadoop/common/'

    - name: Proteger la ruta de Python en las tareas locales del playbook de clase
      ansible.builtin.replace:
        path: "{{ upstream_dir }}/create-instances.yml"
        regexp: '(?m)^- hosts: localhost\n  tasks:'
        replace: |
          - hosts: localhost
            vars:
              ansible_python_interpreter: {{ ansible_playbook_python | quote | to_json }}
            tasks:

    - name: Esperar SSH antes de configurar las instancias recién creadas
      ansible.builtin.replace:
        path: "{{ upstream_dir }}/create-instances.yml"
        regexp: '(?m)^- hosts: all\n  tasks:'
        replace: |
          - hosts: all
            gather_facts: false
            pre_tasks:
              - name: Esperar a que SSH y Python estén disponibles
                ansible.builtin.wait_for_connection:
                  delay: 10
                  timeout: 600
            tasks:

    - name: Configurar memoria y logs antes del primer arranque de YARN
      ansible.builtin.blockinfile:
        path: "{{ upstream_dir }}/hadoop-{{ item }}/yarn-site.xml"
        insertbefore: '</configuration>'
        marker: '<!-- {mark} OPENFOODFACTS -->'
        block: |
          <property><name>yarn.log-aggregation-enable</name><value>true</value></property>
          <property><name>yarn.scheduler.maximum-allocation-mb</name><value>6144</value></property>
          {% if item == 'worker' %}
          <property><name>yarn.nodemanager.resource.memory-mb</name><value>6144</value></property>
          {% endif %}
      loop: [master, worker]

    - name: Guardar las huellas SSH del despliegue en su caché local
      ansible.builtin.copy:
        dest: "{{ upstream_dir }}/ansible.cfg"
        mode: '0644'
        content: |
          [defaults]
          host_key_checking = False
          [ssh_connection]
          ssh_args = -C -o ControlMaster=auto -o ControlPersist=60s -o 'UserKnownHostsFile="{{ runtime_dir }}/known_hosts"'

- name: Crear los clientes de ingesta y de consulta y preparar las conexiones a los seis nodos
  hosts: localhost
  connection: local
  gather_facts: false
  tags: configure
  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python | quote }}"
    ansible_remote_tmp: "{{ runtime_dir }}/tmp"
    # Un cliente escribe los datos (ingesta) y otro los consulta (consulta).
    client_roles: [ingesta, consulta]
  tasks:
    - name: Obtener el master creado por el playbook de clase
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        filters:
          tag:Name: hadoop-master
          instance-state-name: running
      register: master_info

    - name: Comprobar que hay un único master en marcha
      ansible.builtin.assert:
        that: master_info.instances | length == 1
        fail_msg: No se encontró un único hadoop-master en estado running.

    - name: Guardar los datos del master
      ansible.builtin.set_fact:
        master: "{{ master_info.instances[0] }}"

    - name: Permitir SSH desde Anywhere en el grupo del master
      amazon.aws.ec2_security_group:
        name: hadoop-master-sg
        description: sg with partial access to hadoop-master node
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        purge_rules: false
        rules:
          - proto: tcp
            ports: [22]
            cidr_ip: 0.0.0.0/0

    - name: Crear el grupo SSH de los clientes con acceso desde Anywhere
      amazon.aws.ec2_security_group:
        name: hadoop-client-sg
        description: SSH access to Hadoop clients
        vpc_id: "{{ master.vpc_id }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        purge_rules: false
        rules:
          - proto: tcp
            ports: [22]
            cidr_ip: 0.0.0.0/0
      register: client_security_group

    - name: Crear los clientes con la AMI, clave y subred del master
      amazon.aws.ec2_instance:
        name: "hadoop-client-{{ item }}"
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        image_id: "{{ master.image_id }}"
        key_name: "{{ master.key_name }}"
        instance_type: t2.large
        vpc_subnet_id: "{{ master.subnet_id }}"
        security_groups:
          - "{{ master.security_groups | selectattr('group_name', 'equalto', 'hadoop-sg') | map(attribute='group_id') | first }}"
          - "{{ client_security_group.group_id }}"
        network:
          assign_public_ip: true
        tags:
          Group: hadoop-client
          Role: "{{ item }}"
        volumes:
          - device_name: "{{ master.root_device_name }}"
            ebs:
              volume_size: 50
              delete_on_termination: true
        state: running
        wait: true
        wait_timeout: 600
      loop: "{{ client_roles }}"
      register: client_results

    - name: Reunir las instancias de los clientes
      ansible.builtin.set_fact:
        client_instances: "{{ client_results.results | map(attribute='instances') | flatten }}"

    - name: Obtener los workers que administra el master
      amazon.aws.ec2_instance_info:
        region: "{{ aws_region }}"
        profile: "{{ aws_profile }}"
        filters:
          tag:Group: hadoop-worker
          instance-state-name: running
      register: worker_info

    - name: Comprobar los tres workers y los dos clientes
      ansible.builtin.assert:
        that:
          - worker_info.instances | length == 3
          - client_instances | length == 2

    - name: Preparar la lista de nombres e IPs del clúster para los clientes
      ansible.builtin.set_fact:
        cluster_hosts: "{{ cluster_hosts | default([]) + [{'name': item.tags.Name, 'ip': item.private_ip_address}] }}"
      loop: "{{ [master] + worker_info.instances }}"
      loop_control:
        label: "{{ item.tags.Name }}"

    - name: Configurar SSH a los clientes y workers a través del master
      ansible.builtin.copy:
        dest: "{{ runtime_dir }}/ssh_config"
        mode: '0600'
        content: |
          Host *
              User {{ ssh_user }}
              IdentityFile "{{ ssh_key }}"
              IdentitiesOnly yes
              StrictHostKeyChecking accept-new
              UserKnownHostsFile "{{ runtime_dir }}/known_hosts"
              ConnectTimeout 10
          Host hadoop-master
              HostName {{ master.public_ip_address }}
          {% for node in worker_info.instances + client_instances %}
          Host {{ node.tags.Name }}
              HostName {{ node.private_ip_address }}
              ProxyCommand ssh -F "{{ runtime_dir }}/ssh_config" -W %h:%p hadoop-master
          {% endfor %}

    - name: Incorporar las conexiones al inventario de esta ejecución
      ansible.builtin.add_host:
        name: "{{ item.tags.Name }}"
        groups: "{{ [item.tags.Group | replace('hadoop-', '') ~ 's'] + ([item.tags.Role] if item.tags.Role is defined else []) }}"
        node_role: "{{ item.tags.Role | default('') }}"
        node_private_ip: "{{ item.private_ip_address }}"
        ansible_user: "{{ ssh_user }}"
        ansible_ssh_private_key_file: "{{ ssh_key }}"
        ansible_ssh_args: -C -o ControlMaster=auto -o ControlPersist=60s
        ansible_ssh_common_args: "-F {{ (runtime_dir + '/ssh_config') | quote }}"
        ansible_python_interpreter: /usr/bin/python3
      loop: "{{ master_info.instances + worker_info.instances + client_instances }}"
      loop_control:
        label: "{{ item.tags.Name }}"

- name: Preparar las herramientas comunes de los nodos
  hosts: masters:workers:clients
  gather_facts: false
  tags: configure
  tasks:
    - name: Esperar a que los nodos acepten conexiones
      ansible.builtin.wait_for_connection:
        delay: 5
        timeout: 600

    - name: Instalar Python, rsync y Java 8
      become: true
      ansible.builtin.command:
        argv: [yum, install, -y, python3, rsync, java-1.8.0-amazon-corretto-devel]

- name: Instalar Spark y las herramientas de Hadoop en los clientes y configurarlos
  hosts: clients
  gather_facts: false
  tags: configure
  tasks:
    - name: Descargar Spark
      ansible.builtin.get_url:
        url: "https://archive.apache.org/dist/spark/spark-{{ spark_version }}/spark-{{ spark_version }}-bin-hadoop3.tgz"
        dest: "/tmp/spark-{{ spark_version }}.tgz"
        timeout: 300
        mode: '0644'
      register: spark_download
      retries: 3
      delay: 10
      until: spark_download is succeeded

    - name: Descomprimir Spark en opt
      become: true
      ansible.builtin.unarchive:
        src: "/tmp/spark-{{ spark_version }}.tgz"
        dest: /opt
        remote_src: true
        creates: "/opt/spark-{{ spark_version }}-bin-hadoop3"
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"

    - name: Usar una ruta estable para Spark
      become: true
      ansible.builtin.file:
        src: "/opt/spark-{{ spark_version }}-bin-hadoop3"
        dest: /opt/spark
        state: link

    - name: Descargar las herramientas de Hadoop (hdfs y yarn) para el cliente
      ansible.builtin.get_url:
        url: "https://archive.apache.org/dist/hadoop/common/hadoop-{{ hadoop_version }}/hadoop-{{ hadoop_version }}.tar.gz"
        dest: "/tmp/hadoop-{{ hadoop_version }}.tar.gz"
        timeout: 300
        mode: '0644'
      register: hadoop_download
      retries: 3
      delay: 10
      until: hadoop_download is succeeded

    - name: Descomprimir Hadoop en opt
      become: true
      ansible.builtin.unarchive:
        src: "/tmp/hadoop-{{ hadoop_version }}.tar.gz"
        dest: /opt
        remote_src: true
        creates: "/opt/hadoop-{{ hadoop_version }}"
        owner: "{{ ssh_user }}"
        group: "{{ ssh_user }}"

    - name: Usar una ruta estable para Hadoop
      become: true
      ansible.builtin.file:
        src: "/opt/hadoop-{{ hadoop_version }}"
        dest: /opt/hadoop
        state: link

    # El driver de Spark corre en el cliente: debe resolver el master y los workers por nombre.
    - name: Registrar el master y los workers en los hosts del cliente
      become: true
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^[^#]*\b{{ item.name }}\b'
        line: "{{ item.ip }} {{ item.name }}"
      loop: "{{ hostvars['localhost'].cluster_hosts }}"
      loop_control:
        label: "{{ item.name }}"

    - name: Crear la carpeta de configuración Hadoop del cliente
      ansible.builtin.file:
        path: "/home/{{ ssh_user }}/hadoop_conf"
        state: directory
        mode: '0755'

    - name: Leer la configuración de Hadoop desde el master
      ansible.builtin.slurp:
        src: "{{ hadoop_home }}/etc/hadoop/{{ item }}"
      delegate_to: hadoop-master
      loop: [core-site.xml, yarn-site.xml]
      register: master_configuration

    - name: Copiar los puntos de entrada de HDFS y YARN al cliente
      ansible.builtin.copy:
        content: "{{ item.content | b64decode }}"
        dest: "/home/{{ ssh_user }}/hadoop_conf/{{ item.item }}"
        mode: '0644'
      loop: "{{ master_configuration.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: Configurar Spark sobre YARN en los clientes
  hosts: clients
  gather_facts: false
  tags: configure
  vars:
    node_spark_home: /opt/spark
    node_hadoop_home: /opt/hadoop
    node_hadoop_conf: "/home/{{ ssh_user }}/hadoop_conf"
  tasks:
    # El driver corre en el cliente; los executors, en los workers.
    - name: Guardar el modo client y los recursos de Spark
      ansible.builtin.copy:
        dest: "{{ node_spark_home }}/conf/spark-defaults.conf"
        mode: '0644'
        content: |
          spark.master                     yarn
          spark.submit.deployMode          client
          spark.driver.memory              2g
          spark.driver.host                {{ node_private_ip }}
          spark.executor.instances         3
          spark.executor.cores             1
          spark.executor.memory            2g
          spark.executor.memoryOverhead    512m
          spark.pyspark.python             python3

    - name: Guardar las variables de entorno sin duplicarlas
      ansible.builtin.blockinfile:
        path: "/home/{{ ssh_user }}/.bashrc"
        create: true
        mode: '0644'
        marker: '# {mark} OPENFOODFACTS'
        block: |
          export JAVA_HOME={{ java_home }}
          export SPARK_HOME={{ node_spark_home }}
          export HADOOP_HOME={{ node_hadoop_home }}
          export HADOOP_CONF_DIR={{ node_hadoop_conf }}
          export YARN_CONF_DIR={{ node_hadoop_conf }}
          # Identidad en HDFS y YARN: ingesta escribe los datos; consulta los lee y guarda sus resultados.
          export HADOOP_USER_NAME={{ node_role }}
          export PATH=$PATH:$HADOOP_HOME/bin:$SPARK_HOME/bin:$SPARK_HOME/sbin

    - name: Crear la carpeta de trabajo del cliente
      ansible.builtin.file:
        path: "/home/{{ ssh_user }}/{{ remote_dir }}/src"
        state: directory
        mode: '0755'

- name: Comprobar HDFS y YARN antes de cargar datos
  hosts: masters
  gather_facts: false
  tags: configure
  environment:
    JAVA_HOME: "{{ java_home }}"
    HADOOP_HOME: "{{ hadoop_home }}"
    PATH: "{{ hadoop_home }}/bin:/usr/local/bin:/usr/bin:/bin"
  tasks:
    - name: Esperar los tres DataNodes
      ansible.builtin.command: hdfs dfsadmin -report
      register: hdfs_report
      retries: 40
      delay: 10
      until: hdfs_report.stdout is search('Live datanodes \(3\)')
      changed_when: false

    - name: Esperar tres NodeManagers con 6144 MB y dos vcores cada uno
      ansible.builtin.command: yarn node -list -showDetails
      register: yarn_report
      retries: 40
      delay: 10
      until:
        # Evitar \b: Jinja lo interpreta como retroceso al evaluar until.
        - yarn_report.stdout is search('Total Nodes:\s*3(?![0-9])')
        - yarn_report.stdout | regex_findall('Configured\s+Resources\s*:\s*<memory:6144,\s*vCores:2>') | length == 3
      changed_when: false

    - name: Crear las carpetas de datos, resultados y trabajo de cada cliente en HDFS
      ansible.builtin.command: hdfs dfs -mkdir -p /data/raw /data/clean /results /user/ingesta /user/consulta

    # ingesta escribe /data; consulta escribe /results y solo lee /data. Cada uno tiene su /user para el staging de Spark.
    - name: Repartir los permisos de HDFS entre ingesta y consulta
      ansible.builtin.shell: |
        set -euo pipefail
        hdfs dfs -chown -R ingesta /data /user/ingesta
        hdfs dfs -chown -R consulta /results /user/consulta
        hdfs dfs -chmod -R 755 /data /results /user/ingesta /user/consulta
      args:
        executable: /bin/bash

    - name: Ejecutar el ejemplo MapReduce de Hadoop
      ansible.builtin.command: "yarn jar {{ hadoop_home }}/share/hadoop/mapreduce/hadoop-mapreduce-examples-3.3.6.jar pi 3 1000"
      async: 1800
      poll: 15

- name: Descargar y preparar Open Food Facts desde el cliente de ingesta
  hosts: ingesta
  gather_facts: false
  tags: data
  environment:
    JAVA_HOME: "{{ java_home }}"
    HADOOP_HOME: /opt/hadoop
    HADOOP_CONF_DIR: "/home/{{ ssh_user }}/hadoop_conf"
    HADOOP_USER_NAME: ingesta
    PATH: "/opt/hadoop/bin:/usr/local/bin:/usr/bin:/bin"
  tasks:
    - name: Cargar el CSV completo en HDFS sin guardarlo en disco local
      ansible.builtin.shell: |
        set -euo pipefail
        target=/data/raw/openfoodfacts.csv
        if hdfs dfs -test -e "$target"; then exit 0; fi
        hdfs dfs -rm -f "$target.uploading"
        trap 'hdfs dfs -rm -f "$target.uploading"' ERR
        curl -fLsS --retry 3 https://static.openfoodfacts.org/data/en.openfoodfacts.org.products.csv.gz |
          gzip -dc | hdfs dfs -put - "$target.uploading"
        hdfs dfs -mv "$target.uploading" "$target"
      args:
        executable: /bin/bash
      async: 7200
      poll: 15

    - name: Generar la muestra de 100000 filas y el porcentaje por columna
      ansible.builtin.shell: |
        set -euo pipefail
        hdfs dfs -cat /data/raw/openfoodfacts.csv |
          awk -v K=100000 'NR==1{h=$0;next} NR-1<=K{a[NR-1]=$0;next} {j=int(rand()*(NR-1))+1;if(j<=K)a[j]=$0} END{print h;for(i=1;i<=K && i<NR;i++)print a[i];print "TOTAL_FILAS=" NR-1 > "/dev/stderr"}' > muestra.csv.tmp
        # Validar las 100000 filas y que todas tengan tantas columnas como la cabecera.
        awk -F '\t' 'NR==1{cols=NF} NF!=cols{bad=1} END{printf "FILAS: %d COLUMNAS: %d\n",NR-1,cols;exit(NR!=100001 || bad)}' muestra.csv.tmp
        mv muestra.csv.tmp muestra.csv
        awk -F '\t' 'NR==1{h=NF;for(i=1;i<=NF;i++)n[i]=$i;next} {for(i=1;i<=NF;i++)if($i!="")c[i]++} END{for(i=1;i<=h;i++)printf "%d\t%s\t%.1f\n",i,n[i],100*c[i]/(NR-1)}' muestra.csv > columnas_relleno.tsv
        gzip -kf muestra.csv
        wc -l muestra.csv
        hdfs dfs -du -h /data/raw
      args:
        executable: /bin/bash
        chdir: "/home/{{ ssh_user }}"
      async: 3600
      poll: 15

    - name: Preparar la lectura local de la muestra con Spark
      ansible.builtin.copy:
        dest: /tmp/read_sample.py
        mode: '0644'
        content: |
          from pyspark.sql import SparkSession
          spark = SparkSession.builder.getOrCreate()
          df = spark.read.csv("file:///home/{{ ssh_user }}/muestra.csv", sep="\t", header=True, inferSchema=True)
          print("FILAS:", df.count(), "COLUMNAS:", len(df.columns))
          print(df.select("code", "created_t", "nova_group", "energy-kcal_100g", "nutriscore_grade").dtypes)
          spark.stop()

    - name: Leer la muestra con Spark en el cliente de ingesta
      ansible.builtin.command:
        argv:
          - /opt/spark/bin/spark-submit
          - --master
          - local[2]
          - --deploy-mode
          - client
          - --driver-memory
          - 3g
          - /tmp/read_sample.py
      async: 1800
      poll: 15

- name: Validar desde cada cliente que Spark ejecuta el driver en el cliente y los executors en los workers
  hosts: clients
  gather_facts: false
  serial: 1
  tags: verify
  environment:
    JAVA_HOME: "{{ java_home }}"
    HADOOP_HOME: /opt/hadoop
    HADOOP_CONF_DIR: "/home/{{ ssh_user }}/hadoop_conf"
    YARN_CONF_DIR: "/home/{{ ssh_user }}/hadoop_conf"
    HADOOP_USER_NAME: "{{ node_role }}"
    PATH: "/opt/hadoop/bin:/opt/spark/bin:/usr/local/bin:/usr/bin:/bin"
  tasks:
    - name: Obtener el nombre del cliente para comprobar la ubicación del driver
      ansible.builtin.command: hostname
      register: client_hostname
      changed_when: false

    - name: Ejecutar SparkPi desde el cliente
      ansible.builtin.command:
        argv:
          - /opt/spark/bin/spark-submit
          - --class
          - org.apache.spark.examples.SparkPi
          - "/opt/spark/examples/jars/spark-examples_2.12-{{ spark_version }}.jar"
          - "100"
      async: 1800
      poll: 15
      register: spark_pi

    - name: Preparar una aplicación Python de comprobación
      ansible.builtin.copy:
        dest: /tmp/check_spark.py
        mode: '0644'
        content: |
          import socket
          from pyspark.sql import SparkSession
          spark = SparkSession.builder.appName("check-spark").getOrCreate()
          driver = socket.gethostname()
          assert driver == "{{ client_hostname.stdout }}", "El driver no se ejecuta en el cliente"
          workers = spark.sparkContext.parallelize(range(3), 3).map(lambda _: socket.gethostname()).collect()
          assert all(host != driver for host in workers), "Las tareas no se ejecutan en los workers"
          print("DRIVER:", driver)
          print("PYTHON_WORKERS:", workers)
          rows = spark.read.text("/data/raw/openfoodfacts.csv").limit(10).count()
          assert rows == 10, "No se pudieron leer diez filas de Open Food Facts"
          print("HDFS_ROWS:", rows)
          spark.stop()

    - name: Ejecutar la aplicación Python desde el cliente
      ansible.builtin.command: /opt/spark/bin/spark-submit /tmp/check_spark.py
      async: 1800
      poll: 15
      register: spark_python

    # Permisos: ingesta escribe /data; consulta lo lee y solo escribe en /results.
    - name: Escribir en /data/clean (solo debe poder el cliente de ingesta)
      ansible.builtin.command: hdfs dfs -touchz /data/clean/.prueba_permisos
      register: write_data
      failed_when: >-
        (node_role == 'ingesta' and write_data.rc != 0) or
        (node_role == 'consulta' and (write_data.rc == 0 or 'Permission denied' not in write_data.stderr))
      changed_when: false

    - name: Borrar el archivo de prueba de /data/clean
      ansible.builtin.command: hdfs dfs -rm -f -skipTrash /data/clean/.prueba_permisos
      when: write_data.rc == 0
      changed_when: false

    - name: Escribir en /results (solo debe poder el cliente de consulta)
      ansible.builtin.command: hdfs dfs -touchz /results/.prueba_permisos
      register: write_results
      failed_when: >-
        (node_role == 'consulta' and write_results.rc != 0) or
        (node_role == 'ingesta' and (write_results.rc == 0 or 'Permission denied' not in write_results.stderr))
      changed_when: false

    - name: Borrar el archivo de prueba de /results
      ansible.builtin.command: hdfs dfs -rm -f -skipTrash /results/.prueba_permisos
      when: write_results.rc == 0
      changed_when: false

    - name: Comprobar los resultados del driver en el cliente
      ansible.builtin.assert:
        that:
          - "'Pi is roughly' in spark_pi.stdout"
          - "('DRIVER: ' + client_hostname.stdout) in spark_python.stdout"
          - "'PYTHON_WORKERS:' in spark_python.stdout"
          - "'HDFS_ROWS: 10' in spark_python.stdout"

- name: Mostrar los puntos de acceso del clúster
  hosts: localhost
  connection: local
  gather_facts: false
  tags: verify
  tasks:
    - name: Mostrar los puntos de acceso
      ansible.builtin.debug:
        msg:
          - "Master público: {{ master.public_ip_address }} (solo NameNode y ResourceManager; no se lanzan trabajos desde él)."
          - "Cliente de ingesta (escribe /data): {{ (client_instances | selectattr('tags.Role', 'equalto', 'ingesta') | first).private_ip_address }} (SSH a través del master)."
          - "Cliente de consulta (lee /data, escribe /results): {{ (client_instances | selectattr('tags.Role', 'equalto', 'consulta') | first).private_ip_address }} (SSH a través del master)."
